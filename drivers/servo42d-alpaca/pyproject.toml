[project]
name = "servo42d-ascom-alpaca"
version = "0.1.0"
description = "ASCOM Alpaca RA-only telescope driver for MKS SERVO42D/57D CAN"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-can>=4.4,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
servo42d-alpaca = "servo42d_ascom.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servo42d_ascom"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
